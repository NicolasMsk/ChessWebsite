name = "chess-lead-magnet"
main = "worker.js"
compatibility_date = "2026-01-01"

# Variable publique (sera remplacée par "https://www.cours-echecs-paris.fr" en prod)
[vars]
ALLOWED_ORIGIN = "https://www.cours-echecs-paris.fr"

# Binding vers la base de données KV (à remplir après création du namespace)
[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "74b1be0e07f949ba86749422063c463f"

# Les secrets sont configurés via : wrangler secret put <NOM>
# - RESEND_API_KEY       : ta clé API Resend
# - ADMIN_TOKEN          : un token random que tu choisis (pour accéder à /subscribers)
# - STRIPE_WEBHOOK_SECRET : clé de signature du webhook Stripe (whsec_...)
# - UNSUBSCRIBE_SECRET   : clé de signature des liens de désinscription. Ne JAMAIS
#                          la changer une fois des emails partis : les liens qu'ils
#                          contiennent cesseraient de fonctionner.
#                          node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))" | wrangler secret put UNSUBSCRIBE_SECRET

# Wrangler >= 4.36.0. Limites par point de présence Cloudflare.
[[ratelimits]]
name = "SUBSCRIBE_IP_LIMITER"
namespace_id = "2026090501"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "SUBSCRIBE_EMAIL_LIMITER"
namespace_id = "2026090502"
simple = { limit = 1, period = 60 }
